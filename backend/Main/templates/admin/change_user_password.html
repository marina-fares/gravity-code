{% extends "admin/base_site.html" %}

{% block content %}
  <h1>Change password: {{ user.username }}</h1>
  <p>Enter a new password for the user <strong>{{ user.username }}</strong>.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="submit" value="Change Password" class="default">
  </form>
{% endblock %}
