# docker-compose.yml — production
# DB is external (managed Postgres). No db container here.

services:

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: "gravity-app"
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      TZ: Africa/Cairo
      PLATFORM: PRODUCTION
      GUNICORN_WORKERS: 4
      GUNICORN_THREADS: 2
      GUNICORN_TIMEOUT: 120
      LOG_LEVEL: info
    volumes:
      - django-static:/usr/src/app/static
      - ./backend:/usr/src/app
    ports:
      - "5000:5000"
    networks:
      - gravity_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  django-static:

networks:
  gravity_net:
    driver: bridge